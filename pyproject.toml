[project]
authors = [{ name = "gooker_young", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "PySide2>=5.15.2.1; python_version <= '3.10'",
    # dulwich 0.22+ 要求 Python 3.9+，锁定 0.21 以保 Win7(3.8) 兼容
    "dulwich>=0.21.7,<0.22",
    # openpyxl 3.2+ 放弃旧 Python 支持，锁定 3.1
    "openpyxl>=3.1.0,<3.2",
    "typing-extensions>=4.0; python_version < '3.13'",
]
description     = "终极数据库管理软件。"
license         = "MIT"
name            = "finaldb"
readme          = "README.md"
requires-python = ">=3.8,<3.11"
version         = "0.1.0"

[project.optional-dependencies]
dev = [
    "finaldb[lint,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
# fast：高性能引擎（polars + calamine），PyPI 常规 wheel 在 Win10+ 可用；
# Win7 发布包不安装此 extra，运行时探测导入失败自动回退
# sqlite3/openpyxl 基线引擎（语义等价）。
fast = [
    "polars>=1.0",
    "python-calamine>=0.2.0",
]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]
[project.scripts]
finaldb = "finaldb.app:main"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/finaldb"]

[tool.hatch.build.targets.wheel.force-include]
"src/finaldb/py.typed" = "finaldb/py.typed"

[tool.uv]
required-version = ">=0.5.0"

[[tool.uv.index]]
default = true
url     = "https://mirrors.aliyun.com/pypi/simple/"


[dependency-groups]
dev = ["finaldb[dev,docs]"]
